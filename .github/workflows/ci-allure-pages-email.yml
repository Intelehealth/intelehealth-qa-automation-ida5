name: CI — Tests → Allure → Pages

on:
  push:
    branches: [ feature/allure-ci-integration ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

      # STEP 1: Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      # STEP 3: Cache Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}

      # STEP 4: Run tests
      - name: Run Maven tests
        run: mvn clean test
        continue-on-error: true

      # STEP 5: Verify results folder
      - name: Check allure results
        run: |
          if [ -d target/allure-results ]; then
            echo "Allure results found"
            ls -la target/allure-results
          else
            echo "Creating empty allure-results"
            mkdir -p target/allure-results
          fi

      # STEP 6: Install Allure CLI
      - name: Install Allure CLI
        run: |
          curl -Ls -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          sudo tar -zxvf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-2.24.1/bin/allure /usr/bin/allure
          allure --version

      # STEP 7: Generate report safely
      - name: Generate Allure report
        run: |
          mkdir -p allure-report
          allure generate allure-results --clean -o allure-report || true

          if [ ! -f allure-report/index.html ]; then
            echo "Creating fallback report"
            echo "<html><body><h2>No Allure results found</h2></body></html>" > allure-report/index.html
          fi

      # STEP 8: Upload to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # STEP 9: Deploy Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # STEP 10: Add Allure report link to GitHub run summary
      - name: Add Allure report link to summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## 🚀 Automation Execution Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Open Allure Report]($PAGE_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
